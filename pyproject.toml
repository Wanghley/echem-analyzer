[project]
name = "echem-analyzer"
dynamic = ["version"]                      # single source: __version__ in echem_analyzer/__init__.py
description = "Desktop platform for sensor electrochemistry: calibration, voltammetry, impedance, potentiometry and electrode studies from PalmSens and other instruments"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "PySide6>=6.6",
    "xlsxwriter>=3.2",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "openpyxl>=3.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "echem_analyzer/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["echem_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
