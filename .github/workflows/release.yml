name: Release

# Push a version tag (scripts/release.sh X.Y.Z --push does it) and this builds the installers for macOS, Windows and Debian/Ubuntu,
# smoke-tests each one, and attaches them to a GitHub Release. Run it by hand (Actions > Release > Run workflow) to try the builds
# without releasing anything: the installers are then only kept as downloadable build artifacts.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the tag and run the tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: The tag must be v<version> (the version in echem_analyzer/__init__.py)
        if: github.ref_type == 'tag'
        run: python3 packaging/build.py --check-tag "$GITHUB_REF_NAME"
      - name: The changelog must describe this version
        if: github.ref_type == 'tag'
        run: python3 packaging/build.py --release-notes "${GITHUB_REF_NAME#v}" > /dev/null
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - run: uv sync --locked
      - run: uv run pytest -q

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false                    # one platform failing must not hide the others
      matrix:
        include:
          - { name: "macOS (Apple silicon)", os: macos-15 }
          - { name: "macOS (Intel)", os: macos-15-intel }
          - { name: "Windows", os: windows-latest }
          # built on the oldest Ubuntu LTS runner: the program then runs on that glibc and newer (Ubuntu 22.04+, Debian 12+)
          - { name: "Debian / Ubuntu", os: ubuntu-22.04 }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: System libraries for the self-test (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - run: uv sync --locked --group build
      - name: Build, smoke-test and package
        run: uv run python packaging/build.py

      # The packages are tested as a user would receive them, not only as the freshly frozen folder.
      - name: Install the .deb and run it (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo apt-get install -y ./dist/release/echem-analyzer_*.deb
          echem-analyzer --version
          echem-analyzer --selftest
          test -f /usr/share/applications/echem-analyzer.desktop
      - name: Install with the installer and run it (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/release/*-setup.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/CURRENTUSER','/NORESTART','/DIR=C:\EchemInstalled' -Wait
          $env:QT_QPA_PLATFORM = 'offscreen'
          $out = Join-Path $env:RUNNER_TEMP 'installed-selftest.json'
          $p = Start-Process -FilePath 'C:\EchemInstalled\EchemAnalyzer.exe' -ArgumentList '--selftest', $out -Wait -PassThru
          if (Test-Path $out) { Get-Content $out }
          if ($p.ExitCode -ne 0) { throw "the installed program's self-test failed (exit $($p.ExitCode))" }

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish the GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write                     # the only job that may create a release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          merge-multiple: true
          path: artifacts
      - name: Release notes from CHANGELOG.md, and one checksum list
        run: |
          python3 packaging/build.py --release-notes "${GITHUB_REF_NAME#v}" > notes.md
          cat artifacts/*.sha256 | tr -d '\r' > artifacts/SHA256SUMS.txt          # one list, with Unix line endings whatever the runner wrote
          rm artifacts/*.sha256
          ls -l artifacts
      - uses: softprops/action-gh-release@v2
        with:
          name: Echem Analyzer ${{ github.ref_name }}
          body_path: notes.md
          files: artifacts/*
          fail_on_unmatched_files: true
